<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Website Feedback Survey">
  <title>Survey | Ester Alfayo</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
  <script src="js/form-validation.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <h1>Ester Alfayo</h1>
      <p>Web Developer</p>
    </div>
    <ul>
      <li><a href="index.html"><span>🏠</span> Home</a></li>
      <li><a href="about.html"><span>👩‍💻</span> About</a></li>
      <li><a href="projects.html"><span>💼</span> Projects</a></li>
      <li><a href="contact.html"><span>✉️</span> Contact</a></li>
      <li><a href="survey.html" class="active"><span>📝</span> Survey</a></li>
    </ul>
    <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
  </nav>

  <main>
    <h1 class="page-title">Website Feedback Survey</h1>
    
    <form id="surveyForm" class="survey-form">
      <div class="form-group">
        <label for="survey-name">Your Name:</label>
        <input type="text" id="survey-name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="survey-email">Email Address:</label>
        <input type="email" id="survey-email" name="email" required>
      </div>
      
      <fieldset class="form-group">
        <legend>How did you find this website?</legend>
        <label><input type="radio" name="source" value="Google" required> Google</label>
        <label><input type="radio" name="source" value="Social Media"> Social Media</label>
        <label><input type="radio" name="source" value="Friend"> Friend</label>
        <label><input type="radio" name="source" value="Other"> Other</label>
      </fieldset>
      
      <fieldset class="form-group">
        <legend>What features did you like? (Select all that apply)</legend>
        <label><input type="checkbox" name="features" value="Design"> Design</label>
        <label><input type="checkbox" name="features" value="Content"> Content</label>
        <label><input type="checkbox" name="features" value="Navigation"> Navigation</label>
        <label><input type="checkbox" name="features" value="Performance"> Performance</label>
      </fieldset>
      
      <div class="form-group">
        <label for="rating">How would you rate your overall experience?</label>
        <select id="rating" name="rating" required>
          <option value="">Select a rating</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Very Good</option>
          <option value="3">3 - Good</option>
          <option value="2">2 - Fair</option>
          <option value="1">1 - Poor</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="comments">Additional Comments:</label>
        <textarea id="comments" name="comments" rows="5"></textarea>
      </div>
      
      <button type="submit" class="btn">Submit Survey</button>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> Ester Alfayo. All rights reserved.</p>
  </footer>
</body>
</html>
